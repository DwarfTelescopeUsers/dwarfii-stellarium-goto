name: test-artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build workflow run ID containing the standalone artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify standalone archives
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives from build run
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: standalone-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded archives
        run: find artifacts -maxdepth 1 -type f -name '*.zip' -print

      - name: Verify archive integrity
        shell: bash
        run: |
          shopt -s nullglob
          archives=(artifacts/*.zip)

          if (( ${#archives[@]} != 3 )); then
            echo "Expected 3 standalone archives, found ${#archives[@]}." >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            unzip -t "$archive"
          done
